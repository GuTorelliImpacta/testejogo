<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Altina da Sorte: vídeo bingo de 90 bolas, simples e divertido." />
    <meta name="theme-color" content="#0b3d22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Altina da Sorte🍀</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07301f; overscroll-behavior: none; }
      #rotate { display: none; }
      /* celular deitado: pede para virar (o jogo fica pequeno demais para ler) */
      @media (orientation: landscape) and (max-height: 500px) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
          gap: 16px; padding: 24px; text-align: center; background: #07301f; color: #fffbea;
          font: 900 26px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }
        #rotate b { font-size: 64px; line-height: 1; }
        #rotate small { font-size: 20px; font-weight: 700; color: #ffd24a; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate" role="alert"><b aria-hidden="true">📱↻</b>Vire o celular em pé para jogar<small>Altina da Sorte🍀</small></div>
    <noscript>Ative o JavaScript para jogar Altina da Sorte🍀.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
